<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B&C v49 Beter Lezen</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>*{box-sizing:border-box}body{font-family:-apple-system,sans-serif;margin:0;background:#fafaf6;padding:12px}
.header{text-align:center;padding:18px;background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:12px}
.logo{font-family:Georgia,serif;font-size:42px;font-weight:900;background:linear-gradient(135deg,#8b6914,#c9a227,#e8c547);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:12px}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;margin:6px 0}
.btn-black{background:#111;color:#fff}.btn-green{background:#22c55e;color:#fff}.btn-light{background:#f3f4f6;color:#111}
input{width:100%;padding:13px;border:2px solid #111;border-radius:12px;font-size:16px;margin:6px 0}
.preview{width:100%;max-height:32vh;object-fit:contain;background:#f9f9f9;border-radius:12px;margin:10px 0}
.cheese{padding:12px;border:1px solid #eee;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;background:#fff}
.cheese-best{border:2px solid #22c55e;background:#f0fdf4}.score{background:#111;color:#fff;padding:6px 10px;border-radius:8px;font-weight:800;font-size:12px}
.status{font-size:12px;padding:8px;border-radius:10px;text-align:center;margin:8px 0}
.s-ok{background:#d1fae5}.s-warn{background:#fef3c7}.s-err{background:#fee2e2}
.badge{font-size:11px;background:#c9a227;color:#fff;padding:3px 8px;border-radius:20px}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0} .suggest b{font-size:11px;padding:6px 10px;background:#f3f4f6;border-radius:20px;cursor:pointer;border:1px solid #ddd}
.fles{border:2px solid #111;border-radius:16px;padding:12px;margin-bottom:12px;background:#fff;position:relative}
.flesnum{position:absolute;top:-9px;left:14px;background:#111;color:#fff;font-size:10px;padding:4px 10px;border-radius:20px}
canvas{display:none}</style></head><body>
<div class="header"><div class="logo">B&C v49</div><div style="font-size:10px;letter-spacing:3px;color:#c9a227;font-weight:700">BEVERAGES & CHEESE</div><div style="font-size:12px;color:#666">Huisvrouw modus - beter lezen</div></div>
<div class="card">
<b>Scan je fles</b> <span class="badge">v49 FIX</span>
<input type="file" id="fileCam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="fileLib" accept="image/*" style="display:none">
<button class="btn btn-black" onclick="document.getElementById('fileCam').click()">Foto maken</button>
<button class="btn btn-light" onclick="document.getElementById('fileLib').click()">Uit bibliotheek</button>
<img id="preview" class="preview" style="display:none"><canvas id="canvas"></canvas>
<div id="ocrStatus" class="status" style="display:none"></div>
<div id="result" style="display:none">
<input id="wineName" placeholder="Naam">
<div class="suggest" id="suggestBox"></div>
<input id="wineType" placeholder="Type">
<div id="cheeseAdvice"></div>
<button class="btn btn-green" onclick="saveForLater()">Bewaren voor proeverij</button>
<button class="btn btn-light" onclick="resetScan()">Opnieuw</button>
</div></div>
<div class="card"><b>Proeverij</b> <span id="count" class="badge" style="background:#111">0</span><div id="tastingList" style="margin-top:10px"></div>
<div style="display:flex;gap:8px"><button class="btn btn-light" style="flex:1" onclick="clearTasting()">Wissen</button><button class="btn btn-green" style="flex:1" onclick="makePDF()">PDF</button></div></div>
<script>
const CHEESE={"Wijn - Wit":[{n:"Verse Geitenkaas",o:"Loire",r:"Fris bij Sauvignon",s:98},{n:"Feta",o:"GR",r:"Ziltig",s:93}],"Wijn - Rood":[{n:"Comte 18mnd",o:"Jura",r:"Notig bij rood",s:96}],"Bier":[{n:"Oude Cheddar",o:"UK",r:"Klassieker",s:96}],"Default":[{n:"Belegen Gouda",o:"NL",r:"Gaat altijd",s:90}]};
const DICT=["SAUVIGNON BLANC CHILI","SAUVIGNON BLANC","CHARDONNAY","MERLOT","CABERNET","PINOT GRIGIO","PINOT NOIR","HERT OG JAN","HEINEKEN"];
function enhanceSoft(file){return new Promise((res)=>{const img=new Image();img.onload=()=>{const c=document.getElementById('canvas');c.width=img.width*1.8;c.height=img.height*1.8;const ctx=c.getContext('2d');ctx.filter='contrast(1.2) brightness(1.08)';ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',0.92);};img.src=URL.createObjectURL(file);});}
function correct(t){let u=t.toUpperCase();u=u.replace(/AUVIGNON/g,'SAUVIGNON');u=u.replace(/1 DE 9|IDE9/g,'BLANC');if(u.includes('SSS')&&u.includes('UIT'))return'SAUVIGNON BLANC CHILI';if(u.includes('SAUVIGNON'))return'SAUVIGNON BLANC CHILI';for(let w of DICT){if(u.includes(w.split(' ')[0])&&w.split(' ')[0].length>4)return w;}return t;}
function detectType(tx){let u=tx.toUpperCase();if(/SAUVIGNON BLANC|CHARDONNAY|WIT|BLANC/.test(u))return'Wijn - Wit';if(/MERLOT|CABERNET|ROOD|ROUGE/.test(u)&&!u.includes('SAUVIGNON BLANC'))return'Wijn - Rood';if(/BIER|PILS|HEINEKEN|HERT OG/.test(u))return'Bier';return'Wijn - Wit';}
function renderCheese(ty){let arr=CHEESE[ty]||CHEESE.Default;return arr.map((c,i)=>`<div class="cheese ${i==0?'cheese-best':''}"><div><b>${c.n}</b> ${c.o}<br><span style="font-size:11px">${c.r}</span></div><div class="score">${c.s}%</div></div>`).join('');}
let cur=null;let tast=JSON.parse(localStorage.getItem('bc_v49')||'[]');
async function handleFile(f){if(!f)return;cur=URL.createObjectURL(f);let pv=document.getElementById('preview');pv.src=cur;pv.style.display='block';let st=document.getElementById('ocrStatus');st.style.display='block';st.className='status s-warn';st.textContent='Lezen...';document.getElementById('result').style.display='none';
let to=setTimeout(()=>{st.className='status s-warn';st.textContent='Donkere foto - kies suggestie';document.getElementById('result').style.display='block';showSug('');renderPrev();},5500);
try{let enh=await enhanceSoft(f);let r1=await Tesseract.recognize(enh,'eng',{tessedit_pageseg_mode:6});let r2=await Tesseract.recognize(f,'eng',{tessedit_pageseg_mode:6});clearTimeout(to);
let raw=r1.data.text+' '+r2.data.text;console.log(raw);let corr=correct(raw);let ty=detectType(raw+' '+corr);
let lines=raw.split('\n').map(x=>x.trim()).filter(x=>x.length>2&&!/ALLERGIE|BEVAT|0,75/.test(x));
let name=corr;if(corr.toUpperCase().includes('SAUVIGNON'))name='SAUVIGNON BLANC CHILI';else if(lines[0])name=lines[0].slice(0,45);
document.getElementById('wineName').value=name;document.getElementById('wineType').value=ty;st.className='status s-ok';st.textContent='Gevonden: '+name;document.getElementById('result').style.display='block';showSug(name);renderPrev();
}catch(e){clearTimeout(to);st.className='status s-err';st.textContent='Typ zelf - foto te donker';document.getElementById('result').style.display='block';showSug('');renderPrev();}}
function showSug(cur){let box=document.getElementById('suggestBox');let q=(cur||'').toUpperCase();let list=DICT.filter(w=>w.includes(q)||q.includes(w.split(' ')[0])).slice(0,6);if(list.length==0)list=DICT.slice(0,6);box.innerHTML=list.map(w=>`<b onclick="document.getElementById('wineName').value='${w}';document.getElementById('wineType').value='Wijn - Wit';renderPrev()">${w}</b>`).join('');}
function renderPrev(){let t=document.getElementById('wineType').value||'Wijn - Wit';document.getElementById('cheeseAdvice').innerHTML=renderCheese(t);}
function saveForLater(){let n=document.getElementById('wineName').value.trim();let ty=document.getElementById('wineType').value.trim();if(!n)return alert('Vul naam');tast.push({src:cur,name:n,type:ty,cheeseHTML:renderCheese(ty)});localStorage.setItem('bc_v49',JSON.stringify(tast));renderTast();resetScan();}
function renderTast(){document.getElementById('count').textContent=tast.length+' flessen';document.getElementById('tastingList').innerHTML=tast.map((f,i)=>`<div class="fles"><span class="flesnum">FLES ${i+1}</span><div style="display:flex;gap:10px;margin-top:10px"><img src="${f.src}" style="width:60px;height:60px;object-fit:cover;border-radius:8px"><div style="flex:1"><b>${f.name}</b><br><span style="font-size:11px">${f.type}</span></div><button onclick="tast.splice(${i},1);localStorage.setItem('bc_v49',JSON.stringify(tast));renderTast()" style="width:30px;height:30px;background:#fee;border:none;border-radius:8px">X</button></div><div style="margin-top:8px">${f.cheeseHTML}</div></div>`).join('')||'<p style="font-size:12px;color:#999">Nog leeg</p>';}
function resetScan(){document.getElementById('preview').style.display='none';document.getElementById('ocrStatus').style.display='none';document.getElementById('result').style.display='none';}
function clearTasting(){if(confirm('Wissen?')){tast=[];localStorage.setItem('bc_v49',JSON.stringify(tast));renderTast();}}
function makePDF(){if(tast.length==0)return alert('Leeg');let w=window.open('','_blank');w.document.write('<h1>Proeverij</h1>'+tast.map((f,i)=>`<div style="border:2px solid #111;padding:10px;margin:10px"><h3>${i+1}. ${f.name}</h3><img src="${f.src}" style="width:100px"><div>${f.cheeseHTML}</div></div>`).join(''));w.document.close();w.print();}
document.getElementById('fileCam').addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});
document.getElementById('fileLib').addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});
document.getElementById('wineName').addEventListener('input',renderPrev);
document.getElementById('wineType').addEventListener('input',renderPrev);
renderTast();
</script></body></html>
