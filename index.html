<!DOCTYPE html>
<html lang=nl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>B&C - Proeverij met Herkenning</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:10px;background:#fafaf6;color:#111}
.header{text-align:center;padding:18px 10px 10px;background:#fff;border-radius:20px;margin-bottom:10px;box-shadow:0 4px 20px rgba(0,0,0,.07)}
.logo-bc{font-family:serif;font-size:58px;font-weight:900;background:linear-gradient(135deg,#b8860b,#daa520,#ffd700,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.logo-sub{font-size:11px;letter-spacing:4px;color:#b8860b;font-weight:700;margin-top:4px}
.logo-icons{font-size:18px;letter-spacing:12px;margin-top:6px}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 20px rgba(0,0,0,.07);margin-bottom:10px}
button{width:100%;padding:13px;font-size:14px;font-weight:700;border:none;border-radius:12px;margin:4px 0;cursor:pointer}
.btn-black{background:#111;color:#fff}.btn-green{background:#22c55e;color:#fff}.btn-gray{background:#f3f4f6;color:#111}.btn-outline{background:#fff;border:2px solid #111;color:#111}.btn-print{background:#b8860b;color:#fff;font-size:15px;padding:15px}
input[type=text]{width:100%;padding:10px;border:2px solid #111;border-radius:10px;font-size:15px;margin:6px 0}
img{max-width:100%;border-radius:10px;display:block}
.preview{max-height:26vh;object-fit:contain;background:#f9f9f9;width:100%}
.cheese{padding:8px;border:1px solid #eee;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.cheese-score{background:#111;color:#fff;padding:3px 7px;border-radius:6px;font-size:10px;font-weight:700}
.fles{border:2px solid #111;border-radius:16px;padding:10px;margin-bottom:10px;background:#fff;position:relative}
.flesnum{position:absolute;top:-8px;left:12px;background:#111;color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:20px}
.count{font-size:11px;background:#22c55e;color:#fff;padding:3px 8px;border-radius:20px;font-weight:700}
.status{font-size:12px;padding:8px;background:#fff3cd;border-radius:8px;margin:6px 0;text-align:center}
@media print{ body{background:#fff} .no-print{display:none !important} }
</style>
</head><body>

<div class=header>
<div class=logo-bc>B&C</div>
<div class=logo-sub>BEVERAGES & CHEESE</div>
<div class=logo-icons>🍷 🍺 🥃 🧀</div>
<div style="font-size:10px;color:#888;margin-top:6px" id=printDate class=no-print></div>
</div>

<div class=card id=scanCard class="no-print">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>📸 Proeverij</b><span class=count id=count>0 flessen</span></div>
<input type=file id=fFront accept="image/*" capture=environment style=display:none>
<input type=file id=fLib accept="image/*" style=display:none>
<button class=btn-black onclick="document.getElementById('fFront').click()">📸 Foto etiket (bier/wijn/drank)</button>
<button class=btn-gray onclick="document.getElementById('fLib').click()">📁 Uit bibliotheek</button>
<img id=previewBack class=preview style=display:none;margin-top:8px>
<div id=ocrStatus class=status style=display:none>🔍 Etiket lezen...</div>
<div id=editArea style=display:none;margin-top:8px>
<input type=text id=editName placeholder="Naam fles...">
<input type=text id=editType placeholder="Type... b.v. Tripel, Sauvignon, Whisky">
<button class=btn-green onclick="confirmFles()">✅ Opslaan in proeverij</button>
</div>
<div style="display:flex;gap:6px;margin-top:8px">
<button class=btn-outline onclick="clearAll()" style="flex:1">🗑️ Wissen</button>
<button class=btn-green onclick="downloadPDF()" style="flex:1">📄 PDF</button>
<button class=btn-outline onclick="window.print()" style="flex:1">🖨️ Print</button>
</div>
<button class=btn-print onclick="downloadPDF()" id=printBtn style="display:none">📄 DOWNLOAD PDF - <span id=printCount>0</span> FLESSEN</button>
</div>

<div id=list></div>
<div class=card id=emptyPrint style="text-align:center;color:#888;font-size:12px" class=no-print>Nog geen flessen. Scan eerste fles. Hij herkent nu bier/wijn naam van etiket!</div>

<script>
let flessen=JSON.parse(localStorage.getItem('bc_tasting_v37')||'[]');
let currentTemp=null;
const kaasDB=[
 {n:'Verse Geitenkaas',s:98,o:'Loire',r:'Fris bij fris'},
 {n:'Oude Cheddar',s:94,o:'Engeland',r:'Sterk bij bier'},
 {n:'Feta',s:92,o:'Griekenland',r:'Ziltig'},
 {n:'Burrata',s:90,o:'Puglia',r:'Romig'},
 {n:'Comté 12mnd',s:88,o:'Jura',r:'Notig'}
];
function save(){ localStorage.setItem('bc_tasting_v37', JSON.stringify(flessen)); }
function updateUI(){
 document.getElementById('count').textContent=flessen.length+' flessen';
 document.getElementById('printCount').textContent=flessen.length;
 document.getElementById('printBtn').style.display=flessen.length>0?'block':'none';
 document.getElementById('emptyPrint').style.display=flessen.length>0?'none':'block';
 document.getElementById('printDate').textContent='Proeverij: '+new Date().toLocaleDateString('nl-NL')+' - '+flessen.length+' flessen';
}
function getKaasForType(type){
 type=(type||'').toLowerCase();
 if(type.includes('bier')||type.includes('tripel')||type.includes('blond')||type.includes('trappist')) return [kaasDB[1],kaasDB[4],kaasDB[0]];
 if(type.includes('whisky')||type.includes('rum')||type.includes('sterk')) return [kaasDB[1],kaasDB[4],kaasDB[3]];
 return [kaasDB[0],kaasDB[2],kaasDB[3]];
}
function makeCheeseHTML(type){ return getKaasForType(type).map(c=>`<div class=cheese><div><b>${c.n}</b> <span style="font-size:10px;color:#888">${c.o}</span><br><span style="font-size:11px">${c.r}</span></div><div class=cheese-score>${c.s}%</div></div>`).join(''); }
function render(){
 updateUI();
 document.getElementById('list').innerHTML=flessen.map((f,i)=>`
  <div class=fles><span class=flesnum>FLES ${i+1} - ${f.type.toUpperCase()}</span>
  <div style="display:flex;gap:10px;margin-top:10px"><img src="${f.src}" style="width:80px;height:80px;object-fit:cover;border-radius:8px"><div style="flex:1"><input type=text value="${f.name}" onchange="editFlesName(${i},this.value)" style="font-weight:700;font-size:14px;padding:6px"><br><span style="font-size:11px;color:#666">${f.type} - ${f.desc}</span><br><span style="font-size:9px;color:#999">${f.date}</span></div><button onclick="removeFles(${i})" class=no-print style="width:32px;height:32px;background:#fee;border:none;border-radius:8px">✕</button></div>
  <div style="margin-top:8px"><b style="font-size:10px;letter-spacing:1px">🧀 KAAS:</b>${f.cheeseHTML}</div></div>
 `).join('');
}
async function handleFile(file){
 if(!file) return;
 const src=URL.createObjectURL(file);
 const p=document.getElementById('previewBack'); p.src=src; p.style.display='block';
 const st=document.getElementById('ocrStatus'); st.style.display='block'; st.textContent='🔍 Etiket lezen... (bier/wijn herkennen)';
 try{
   const res=await Tesseract.recognize(file,'nld+eng');
   let txt=res.data.text||'';
   console.log('OCR:',txt);
   let name=detectName(txt, file.name);
   let type=detectType(txt);
   st.textContent='✅ Gevonden: '+name;
   currentTemp={src,name,type,desc:'Geanalyseerd van etiket',raw:txt};
   document.getElementById('editName').value=name;
   document.getElementById('editType').value=type;
   document.getElementById('editArea').style.display='block';
 } catch(e){
   console.error(e);
   st.textContent='⚠️ Kon niet lezen, vul zelf in:';
   currentTemp={src,name:'Fles '+(flessen.length+1),type:'Onbekend',desc:'Handmatig'};
   document.getElementById('editName').value=currentTemp.name;
   document.getElementById('editType').value='';
   document.getElementById('editArea').style.display='block';
 }
}
function detectName(txt, fallback){
 txt=txt.toUpperCase();
 const beers=['LA TRAPPE','CHIMAY','DUVEL','HEINEKEN','GROLSCH','BRAND','LEFFE','HOEGAARDEN','WESTMALLE','TRIPEL','BLOND','DUBBEL','STOUT','IPA','LAGER','PILS','TRAPPIST'];
 for(let b of beers){ if(txt.includes(b)) return b.charAt(0)+b.slice(1).toLowerCase()+' - '+ (txt.match(new RegExp(b+'\\s*[A-Z]*','i'))||[b])[0]; }
 let lines=txt.split('\n').filter(l=>l.trim().length>3);
 if(lines[0]) return lines[0].substring(0,30);
 return fallback.replace('.jpg','').replace('.png','').substring(0,20) || 'Fles '+(flessen.length+1);
}
function detectType(txt){
 txt=txt.toLowerCase();
 if(txt.includes('bier')||txt.includes('beer')||txt.includes('blond')||txt.includes('tripel')||txt.includes('trappist')||txt.includes('ipa')||txt.includes('pils')||txt.includes('%')) return 'Bier';
 if(txt.includes('sauvignon')||txt.includes('merlot')||txt.includes('chardonnay')||txt.includes('wijn')||txt.includes('wine')||txt.includes('chili')||txt.includes('frankrijk')) return 'Wijn';
 if(txt.includes('whisky')||txt.includes('whiskey')||txt.includes('rum')||txt.includes('vodka')||txt.includes('gin')) return 'Sterke drank';
 return 'Drank';
}
function confirmFles(){
 if(!currentTemp) return;
 let name=document.getElementById('editName').value||currentTemp.name;
 let type=document.getElementById('editType').value||currentTemp.type;
 flessen.push({src:currentTemp.src,name,type,desc:'Herkenning: '+type+' - '+new Date().toLocaleTimeString(),cheeseHTML:makeCheeseHTML(type),date:new Date().toLocaleString('nl-NL')});
 save(); render();
 document.getElementById('editArea').style.display='none';
 document.getElementById('ocrStatus').style.display='none';
 document.getElementById('previewBack').style.display='none';
 currentTemp=null;
 window.scrollTo({top:0,behavior:'smooth'});
}
function editFlesName(i,val){ flessen[i].name=val; save(); }
function removeFles(i){ flessen.splice(i,1); save(); render(); }
function clearAll(){ if(confirm('Wissen?')){ flessen=[]; save(); render(); } }
function downloadPDF(){
 if(flessen.length==0) return alert('Nog geen flessen');
 const {jsPDF}=window.jspdf; const doc=new jsPDF(); let y=10;
 doc.setFontSize(18); doc.text('B&C - BEVERAGES & CHEESE',10,y); y+=7;
 doc.setFontSize(10); doc.text('Proeverij '+new Date().toLocaleDateString('nl-NL')+' - '+flessen.length+' flessen',10,y); y+=10;
 flessen.forEach((f,i)=>{ if(y>260){doc.addPage(); y=10;} doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.text(`${i+1}. ${f.name} (${f.type})`,10,y); y+=5; doc.setFontSize(8); doc.setFont(undefined,'normal'); doc.text(`Advies: Geitenkaas, Cheddar, Feta`,10,y); y+=8; });
 doc.save('BC-Proeverij-'+new Date().toISOString().slice(0,10)+'.pdf');
}
document.getElementById('fFront').addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]); e.target.value='';});
document.getElementById('fLib').addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]); e.target.value='';});
render();
</script>
</body></html>
