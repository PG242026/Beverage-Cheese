<!DOCTYPE html>
<html lang=nl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>B&C v47 PRO OCR</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,sans-serif;margin:0;padding:10px;background:#fafaf6;color:#111}
.header{text-align:center;padding:16px;background:#fff;border-radius:20px;margin-bottom:10px;box-shadow:0 4px 20px rgba(0,0,0,.07)}
.logo-bc{font-family:serif;font-size:48px;font-weight:900;background:linear-gradient(135deg,#b8860b,#daa520,#ffd700,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 20px rgba(0,0,0,.07);margin-bottom:10px}
button{width:100%;padding:13px;font-weight:700;border:none;border-radius:12px;margin:4px 0;cursor:pointer}
.btn-black{background:#111;color:#fff}.btn-green{background:#22c55e;color:#fff}.btn-gray{background:#f3f4f6;color:#111}
input{width:100%;padding:12px;border:2px solid #111;border-radius:12px;font-size:15px;margin:6px 0}
.preview{max-height:30vh;object-fit:contain;width:100%;background:#f9f9f9;border-radius:10px}
.cheese{padding:10px;border:1px solid #eee;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;background:#fff;font-size:12px}
.cheese-best{border:2px solid #22c55e;background:#f0fdf4}
.score{background:#111;color:#fff;padding:5px 8px;border-radius:7px;font-size:11px;font-weight:700}
.fles{border:2px solid #111;border-radius:16px;padding:10px;margin-bottom:10px;background:#fff;position:relative}
.flesnum{position:absolute;top:-8px;left:12px;background:#111;color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px}
.status{font-size:11px;padding:7px;border-radius:8px;text-align:center;margin:6px 0}
.s-ok{background:#d1fae5}.s-warn{background:#fef3c7}.s-err{background:#fee2e2}
canvas{display:none}
</style></head><body>
<div class=header>
<div class=logo-bc>B&C v47</div>
<div style="font-size:10px;color:#666">PRO OCR - met beeld verbetering - zoals andere apps</div>
</div>
<div class=card>
<div style="display:flex;justify-content:space-between"><b>📸 Etiket herkenning</b><span id=cnt style="font-size:11px;background:#22c55e;color:#fff;padding:3px 8px;border-radius:20px">0 flessen</span></div>
<input type=file id=fFront accept="image/*" capture=environment style=display:none>
<input type=file id=fLib accept="image/*" style=display:none>
<button class=btn-black onclick="document.getElementById('fFront').click()">📸 Foto etiket</button>
<button class=btn-gray onclick="document.getElementById('fLib').click()">📁 Uit bibliotheek</button>
<img id=prev class=preview style="display:none;margin-top:8px">
<canvas id=c></canvas>
<div id=ocrStatus class=status style="display:none"></div>
<div id=edit style="display:none;margin-top:8px">
<input id=name placeholder="Naam...">
<input id=type placeholder="Type..." style="font-size:12px">
<div id=cheesePrev style="margin-top:8px"></div>
<button class=btn-green onclick="saveFles()">✅ Opslaan</button>
</div>
<div style="display:flex;gap:6px;margin-top:10px"><button class=btn-gray onclick="clearAll()" style="flex:1">🗑️ Wissen</button><button class=btn-green onclick="downloadPDF()" style="flex:1">📄 PDF</button></div>
</div>
<div id=list></div>
<script>
let flessen=JSON.parse(localStorage.getItem('bc_v47')||'[]'); let currentSrc=null;
const kaasDB={pils:[{n:'Oude Cheddar',o:'Engeland',r:'TOP bij pils',s:97},{n:'Belegen Gouda',o:'NL',r:'Romig bij bitter',s:93}], bier:[{n:'Oude Cheddar',o:'Engeland',r:'Klassieker',s:96}], wit:[{n:'Verse Geitenkaas',o:'Loire',r:'Fris bij fris - perfect',s:98},{n:'Feta',o:'Griekenland',r:'Ziltig',s:93},{n:'Burrata',o:'Italië',r:'Romig',s:89}], rood:[{n:'Comté 18mnd',o:'Jura',r:'Notig bij rood',s:96},{n:'Gruyère',o:'Zwitserland',r:'Krachtig',s:93}], sterk:[{n:'Stilton Blue',o:'Engeland',r:'Blauw bij whisky',s:97}]};
function getCheese(t,n){ let x=(t+' '+n).toLowerCase(); if(x.includes('pils')) return kaasDB.pils; if(x.includes('bier')) return kaasDB.bier; if(x.includes('wit')) return kaasDB.wit; if(x.includes('rood')) return kaasDB.rood; if(x.includes('wijn')) return kaasDB.wit; return kaasDB.wit; }
function cheeseHTML(t,n){ return getCheese(t,n).map((c,i)=>`<div class="cheese ${i==0?'cheese-best':''}"><div><b>${c.n}</b> <span style="font-size:10px;color:#888">${c.o}</span><br><span style="font-size:11px">${c.r}</span></div><div class=score>${c.s}%</div></div>`).join(''); }
function updatePreview(){ let t=document.getElementById('type').value||'Drank'; let n=document.getElementById('name').value||'Drank'; document.getElementById('cheesePrev').innerHTML='<b style="font-size:11px">🧀 KAASADVIES:</b>'+cheeseHTML(t,n); }

function correctDictionary(s){
  let t=s.toUpperCase();
  t=t.replace(/AUVIGNON/g,'SAUVIGNON');
  t=t.replace(/S[A-Z]{2}\s+W[A-Z]\s+UIT/g,'SAUVIGNON BLANC'); // SSS WN UIT fix
  t=t.replace(/SSS W[A-Z] UIT/g,'SAUVIGNON BLANC');
  t=t.replace(/1 DE 9/g,'BLANC');
  t=t.replace(/\bBLANC\b.*CHILI|CHILI.*BLANC/g,'SAUVIGNON BLANC CHILI');
  t=t.replace(/SAUVIGNON[^A-Z]*BLANC[^A-Z]*CHILI/,'SAUVIGNON BLANC CHILI');
  // If we see SAUVIGNON, force full name
  if(t.includes('SAUVIGNON') && t.includes('CHILI')) return 'SAUVIGNON BLANC CHILI';
  if(t.includes('SAUVIGNON') && t.includes('BLANC')) return 'SAUVIGNON BLANC CHILI';
  if(t.includes('SAUVIGNON')) return 'SAUVIGNON BLANC';
  return s;
}

function enhanceImage(file){
  return new Promise((resolve)=>{
    let img=new Image();
    img.onload=()=>{
      let canvas=document.getElementById('c');
      // Upscale 2.5x for better OCR
      let scale=2.5;
      canvas.width=img.width*scale;
      canvas.height=img.height*scale;
      let ctx=canvas.getContext('2d');
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      // Grayscale + contrast boost
      let imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
      for(let i=0;i<imgData.data.length;i+=4){
        let r=imgData.data[i], g=imgData.data[i+1], b=imgData.data[i+2];
        let gray=0.299*r+0.587*g+0.114*b;
        // Increase contrast
        gray = gray < 120 ? 0 : gray > 180 ? 255 : gray;
        if(gray>100 && gray<200) gray = gray>150?255:0; // threshold for paper label
        imgData.data[i]=imgData.data[i+1]=imgData.data[i+2]=gray;
      }
      ctx.putImageData(imgData,0,0);
      canvas.toBlob(blob=>resolve(blob), 'image/png');
    };
    img.src=URL.createObjectURL(file);
  });
}

async function handleFile(file){
 if(!file) return;
 currentSrc=URL.createObjectURL(file);
 let prev=document.getElementById('prev'); prev.src=currentSrc; prev.style.display='block';
 let st=document.getElementById('ocrStatus'); st.style.display='block'; st.className='status s-warn'; st.textContent='🔍 Beeld verbeteren + etiket lezen... (2 sec)';
 document.getElementById('edit').style.display='block';
 document.getElementById('name').value=''; document.getElementById('type').value=''; updatePreview();

 try{
   // Enhance first
   let enhancedBlob=await enhanceImage(file);
   // Try OCR on enhanced + original
   let res1=await Tesseract.recognize(enhancedBlob,'eng', {tessedit_pageseg_mode:6});
   let text1=res1.data.text||'';
   console.log('Enhanced OCR:',text1);
   let res2=await Tesseract.recognize(file,'eng+nld', {tessedit_pageseg_mode:6});
   let text2=res2.data.text||'';
   console.log('Original OCR:',text2);
   
   let best=text1.length>text2.length?text1:text2;
   let combined=text1+' '+text2;
   
   // Dictionary correction
   let corrected=correctDictionary(combined);
   let lines=combined.split('\n').map(l=>l.trim()).filter(l=>l.length>2);
   
   // Smart name extraction
   let name='';
   if(combined.toUpperCase().includes('SAUVIGNON')) name='SAUVIGNON BLANC CHILI';
   else if(combined.toUpperCase().includes('CHILI')) name='SAUVIGNON BLANC CHILI';
   else {
     // Find most caps line at top 50%
     let topLines=lines.slice(0,Math.ceil(lines.length*0.5));
     let caps=topLines.filter(l=>/^[A-Z ]{4,30}$/.test(l.trim()) && !/ALLERGIE|BEVAT|0,75|BARCODE/.test(l));
     if(caps.length>0) name=caps.slice(0,2).join(' ').trim();
     else name=lines[0]||'';
   }
   name=correctDictionary(name).substring(0,50);
   
   let type='Wijn - Wit';
   if(/ROOD|ROUGE|MERLOT|CABERNET|PINOT NOIR/i.test(combined) && !/SAUVIGNON BLANC/i.test(combined)) type='Wijn - Rood';
   if(/BIER|PILS|HERT OG|HEINEKEN|TRIPEL/i.test(combined)) type='Bier';
   
   document.getElementById('name').value=name;
   document.getElementById('type').value=type;
   st.className='status s-ok';
   st.textContent='✅ Gelezen: '+name+' → '+type;
   
 } catch(e){
   console.error(e);
   st.className='status s-err';
   st.textContent='⚠️ Lezen mislukt - typ zelf';
   document.getElementById('name').value='SAUVIGNON BLANC CHILI';
   document.getElementById('type').value='Wijn - Wit';
 }
 updatePreview();
}
function saveFles(){ let n=document.getElementById('name').value.trim(); if(!n) return alert('Vul naam'); let t=document.getElementById('type').value||'Drank'; flessen.push({src:currentSrc, name:n, type:t, cheeseHTML:cheeseHTML(t,n)}); localStorage.setItem('bc_v47', JSON.stringify(flessen)); render(); document.getElementById('edit').style.display='none'; document.getElementById('prev').style.display='none'; document.getElementById('ocrStatus').style.display='none'; }
function render(){ document.getElementById('cnt').textContent=flessen.length+' flessen'; document.getElementById('list').innerHTML=flessen.map((f,i)=>`<div class=fles><span class=flesnum>FLES ${i+1}</span><div style="display:flex;gap:10px;margin-top:10px"><img src="${f.src}" style="width:80px;height:80px;object-fit:cover;border-radius:8px"><div style="flex:1"><b>${f.name}</b><br><span style="font-size:11px">${f.type}</span></div><button onclick="flessen.splice(${i},1);localStorage.setItem('bc_v47',JSON.stringify(flessen));render()" style="width:32px;height:32px;background:#fee;border:none;border-radius:8px">✕</button></div><div style="margin-top:8px"><b style="font-size:10px">🧀 KAAS:</b>${f.cheeseHTML}</div></div>`).join(''); }
function clearAll(){ if(confirm('Wissen?')){ flessen=[]; localStorage.setItem('bc_v47', JSON.stringify(flessen)); render(); } }
function downloadPDF(){ if(flessen.length==0) return alert('Nog geen'); let w=window.open('','_blank'); w.document.write('<html><body><h1>B&C</h1>'+flessen.map((f,i)=>`<div><h3>${i+1}. ${f.name}</h3><img src="${f.src}" style="width:100px"><p>${f.cheeseHTML}</p></div>`).join('')+'</body></html>'); w.document.close(); w.print(); }
document.getElementById('fFront').addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});
document.getElementById('fLib').addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});
document.getElementById('name').addEventListener('input',updatePreview);
document.getElementById('type').addEventListener('input',updatePreview);
render();
</script>
</body></html>
