<!DOCTYPE html>
<html lang=nl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>B&C v40 FINAL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:10px;background:#fafaf6;color:#111}
.header{text-align:center;padding:18px 10px 10px;background:#fff;border-radius:20px;margin-bottom:10px;box-shadow:0 4px 20px rgba(0,0,0,.07)}
.logo-bc{font-family:serif;font-size:58px;font-weight:900;background:linear-gradient(135deg,#b8860b,#daa520,#ffd700,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.logo-sub{font-size:11px;letter-spacing:4px;color:#b8860b;font-weight:700;margin-top:4px}
.logo-icons{font-size:18px;letter-spacing:12px;margin-top:6px}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 20px rgba(0,0,0,.07);margin-bottom:10px}
button{width:100%;padding:13px;font-size:14px;font-weight:700;border:none;border-radius:12px;margin:4px 0;cursor:pointer}
.btn-black{background:#111;color:#fff}.btn-green{background:#22c55e;color:#fff}.btn-gray{background:#f3f4f6;color:#111}.btn-outline{background:#fff;border:2px solid #111;color:#111}.btn-print{background:#b8860b;color:#fff}
input[type=text]{width:100%;padding:12px;border:2px solid #111;border-radius:12px;font-size:16px;margin:6px 0}
input:focus{outline:none;border-color:#b8860b}
img{max-width:100%;border-radius:10px;display:block}
.preview{max-height:30vh;object-fit:contain;background:#f9f9f9;width:100%}
.cheese{padding:10px;border:1px solid #eee;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;background:#fff}
.cheese-best{border:2px solid #22c55e;background:#f0fdf4}
.cheese-score{background:#111;color:#fff;padding:5px 9px;border-radius:7px;font-size:11px;font-weight:700}
.fles{border:2px solid #111;border-radius:16px;padding:10px;margin-bottom:10px;background:#fff;position:relative}
.flesnum{position:absolute;top:-8px;left:12px;background:#111;color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px}
.count{font-size:11px;background:#22c55e;color:#fff;padding:4px 9px;border-radius:20px;font-weight:700}
.recent-btn{display:inline-block;padding:6px 10px;margin:3px;background:#f3f4f6;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid #ddd}
@media print{ .no-print{display:none !important} }
</style>
</head><body>

<div class=header>
<div class=logo-bc>B&C</div>
<div class=logo-sub>BEVERAGES & CHEESE</div>
<div class=logo-icons>🍷 🍺 🥃 🧀</div>
<div style="font-size:10px;color:#888;margin-top:6px" id=printDate data-v="v40"></div>
</div>

<div class=card id=scanCard class="no-print">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>📸 Proeverij</b><span class=count id=count>0 flessen</span></div>
<input type=file id=fFront accept="image/*" capture=environment style=display:none>
<input type=file id=fLib accept="image/*" style=display:none>
<button class=btn-black onclick="document.getElementById('fFront').click()">📸 Foto fles etiket</button>
<button class=btn-gray onclick="document.getElementById('fLib').click()">📁 Uit bibliotheek</button>
<img id=previewBack class=preview style=display:none;margin-top:8px>

<div id=editArea style=display:none;margin-top:10px>
<b style="font-size:12px">Naam fles (typ zelf, onthoudt voor volgende keer):</b>
<input type=text id=editName placeholder="Bv: Hertog Jan Pilsener" autocomplete=off>
<div id=recentList style="margin:4px 0"></div>
<div style="display:flex;gap:6px">
<input type=text id=editType placeholder="Type: Bier / Wijn" style="flex:1" value="Bier">
<input type=text id=editYear placeholder="Jaar" style="width:70px">
</div>
<div id=cheesePreview style="margin-top:10px"></div>
<button class=btn-green onclick="confirmFles()" style="margin-top:8px;font-size:16px">✅ Opslaan + kaasadvies bewaren</button>
</div>

<div style="display:flex;gap:6px;margin-top:10px">
<button class=btn-outline onclick="clearAll()" style="flex:1">🗑️ Wissen</button>
<button class=btn-green onclick="downloadPDF()" style="flex:1">📄 PDF</button>
<button class=btn-outline onclick="window.print()" style="flex:1">🖨️ Print</button>
</div>
<button class=btn-print onclick="downloadPDF()" id=printBtn style="display:none;margin-top:8px">📄 DOWNLOAD PDF PROEVERIJ - <span id=printCount>0</span> FLESSEN</button>
</div>

<div id=list></div>
<div class=card id=emptyPrint style="text-align:center;color:#888;font-size:12px" class=no-print>Scan fles, typ naam (bv Hertog Jan Pilsener), direct kaasadvies + opslaan voor print.</div>

<script>
let flessen=JSON.parse(localStorage.getItem('bc_v39')||'[]');
let recentNames=JSON.parse(localStorage.getItem('bc_recent_names')||'["Hertog Jan Pilsener","La Trappe Blond","Heineken","Grolsch","Duvel","Leffe Blond","Chimay Blauw","Sauvignon Blanc Chili"]');
let currentTemp=null;

const kaasDB={
 pilsener:[{n:'Oude Cheddar',o:'Engeland',r:'Zout & krachtig bij fris pils - TOP',s:97},{n:'Belegen Gouda',o:'NL',r:'Romig, balanceert bitter',s:93},{n:'Parmezaan 24mnd',o:'Italië',r:'Umami bij pils',s:89}],
 bier:[{n:'Oude Cheddar',o:'Engeland',r:'Klassieker bij bier',s:96},{n:'Gouda Oud',o:'NL',r:'Krachtig bij bier',s:92},{n:'Comté',o:'Frankrijk',r:'Notig',s:88}],
 wijn:[{n:'Verse Geitenkaas',o:'Loire',r:'Fris bij fris',s:98},{n:'Feta',o:'Griekenland',r:'Ziltig bij droog',s:92},{n:'Burrata',o:'Puglia',r:'Romig vs zuur',s:90}]
};

function getCheese(type,name){
 let t=(type+name).toLowerCase();
 if(t.includes('pils')) return kaasDB.pilsener;
 if(t.includes('bier')||t.includes('tripel')||t.includes('blond')||t.includes('hertog')||t.includes('heineken')||t.includes('grolsch')) return t.includes('pils')?kaasDB.pilsener:kaasDB.bier;
 return t.includes('wijn')||t.includes('sauvignon')||t.includes('merlot')?kaasDB.wijn:kaasDB.bier;
}
function makeCheeseHTML(type,name,hl=true){
 return getCheese(type,name).map((c,i)=>`<div class="cheese ${i==0&&hl?'cheese-best':''}"><div><b>${c.n}</b> <span style="font-size:10px;color:#888">${c.o}</span><br><span style="font-size:11px">${c.r}</span></div><div class=cheese-score>${c.s}%</div></div>`).join('');
}
function save(){ localStorage.setItem('bc_v39', JSON.stringify(flessen)); localStorage.setItem('bc_recent_names', JSON.stringify(recentNames)); updateUI(); }
function updateUI(){
 document.getElementById('count').textContent=flessen.length+' flessen';
 document.getElementById('printCount').textContent=flessen.length;
 document.getElementById('printBtn').style.display=flessen.length>0?'block':'none';
 document.getElementById('emptyPrint').style.display=flessen.length>0?'none':'block';
 document.getElementById('printDate').textContent='v40 FINAL - Proeverij: '+new Date().toLocaleDateString('nl-NL')+' - '+flessen.length+' flessen';
}
function render(){
 updateUI();
 document.getElementById('list').innerHTML=flessen.map((f,i)=>`
  <div class=fles><span class=flesnum>FLES ${i+1} - ${f.type.toUpperCase()}</span>
  <div style="display:flex;gap:10px;margin-top:10px"><img src="${f.src}" style="width:80px;height:80px;object-fit:cover;border-radius:8px"><div style="flex:1"><b>${f.name}</b><br><span style="font-size:11px;color:#666">${f.type}</span><br><span style="font-size:9px;color:#999">${f.date}</span></div><button onclick="removeFles(${i})" class=no-print style="width:32px;height:32px;background:#fee;border:none;border-radius:8px">✕</button></div>
  <div style="margin-top:8px"><b style="font-size:10px">🧀 KAASADVIES:</b>${f.cheeseHTML}</div></div>
 `).join('');
}
function showRecent(){
 let q=document.getElementById('editName').value.toLowerCase();
 let filtered=recentNames.filter(n=>n.toLowerCase().includes(q)).slice(0,6);
 document.getElementById('recentList').innerHTML=filtered.map(n=>`<span class=recent-btn onclick="pickRecent('${n.replace(/'/g,'&#39;')}')">${n}</span>`).join('') + (q.length>1?`<span class=recent-btn style="background:#111;color:#fff" onclick="pickRecent('${q}')+ ' gebruiken'">+ "${document.getElementById('editName').value}" gebruiken</span>`:'');
 document.getElementById('cheesePreview').innerHTML='<b style="font-size:11px">🧀 DIRECT KAASADVIES VOOR DEZE FLES:</b>'+makeCheeseHTML(document.getElementById('editType').value, document.getElementById('editName').value||'bier');
}
function pickRecent(name){
 document.getElementById('editName').value=name;
 if(name.toLowerCase().includes('jan')||name.toLowerCase().includes('pils')||name.toLowerCase().includes('heineken')) document.getElementById('editType').value='Bier - Pilsener';
 showRecent();
}
function handleFile(file){
 if(!file) return;
 const src=URL.createObjectURL(file);
 const p=document.getElementById('previewBack'); p.src=src; p.style.display='block';
 currentTemp={src};
 document.getElementById('editArea').style.display='block';
 document.getElementById('editName').value='';
 document.getElementById('editName').focus();
 showRecent();
 document.getElementById('editName').addEventListener('input', showRecent);
 document.getElementById('editType').addEventListener('input', showRecent);
}
function confirmFles(){
 let name=document.getElementById('editName').value.trim();
 if(!name) return alert('Vul naam in, bv Hertog Jan Pilsener');
 let type=document.getElementById('editType').value||'Bier';
 if(!recentNames.includes(name)){ recentNames.unshift(name); recentNames=recentNames.slice(0,30); }
 flessen.push({src:currentTemp.src,name,type,cheeseHTML:makeCheeseHTML(type,name),date:new Date().toLocaleString('nl-NL')});
 save(); render();
 document.getElementById('editArea').style.display='none';
 document.getElementById('previewBack').style.display='none';
 currentTemp=null;
}
function removeFles(i){ flessen.splice(i,1); save(); render(); }
function clearAll(){ if(confirm('Hele proeverij wissen?')){ flessen=[]; save(); render(); } }
function downloadPDF(){
 if(flessen.length==0) return alert('Nog geen flessen');
 const {jsPDF}=window.jspdf; const doc=new jsPDF(); let y=12;
 doc.setFontSize(18); doc.text('B&C - BEVERAGES & CHEESE',10,y); y+=8;
 doc.setFontSize(10); doc.text('Proeverij '+new Date().toLocaleDateString('nl-NL')+' - '+flessen.length+' flessen',10,y); y+=10;
 flessen.forEach((f,i)=>{ if(y>270){doc.addPage(); y=12;} doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.text(`${i+1}. ${f.name} (${f.type})`,10,y); y+=6; doc.setFontSize(9); doc.setFont(undefined,'normal'); let adv=getCheese(f.type,f.name).map(c=>c.n+' '+c.s+'%').join(' - '); doc.text('Kaas: '+adv,10,y); y+=10; });
 doc.save('BC-Proeverij-'+new Date().toISOString().slice(0,10)+'.pdf');
}
document.getElementById('fFront').addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]); e.target.value='';});
document.getElementById('fLib').addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]); e.target.value='';});
render();
</script>
</body></html>
