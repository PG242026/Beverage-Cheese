// Auto-save system - werkt op alle telefoons/tablets
function autoSavePhoto(dataUrl, drinkName){
  try {
    // 1. Opslaan in browser geheugen (blijft bewaard)
    const history = JSON.parse(localStorage.getItem('kaasHistory')||'[]');
    history.unshift({
      id: Date.now(),
      date: new Date().toLocaleString('nl-NL'),
      drink: drinkName,
      image: dataUrl,
      lat: currentLat || 0,
      lon: currentLon || 0,
      region: currentRegion
    });
    // max 20 bewaren
    if(history.length>20) history.pop();
    localStorage.setItem('kaasHistory', JSON.stringify(history));
    
    // 2. Automatisch downloaden naar Downloads map
    const a = document.createElement('a');
    a.href = dataUrl;
    const safeName = drinkName.replace(/[^a-z0-9]/gi,'_').substring(0,20);
    a.download = `kaas-pairing-${safeName}-${new Date().toISOString().slice(0,10)}.jpg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    // 3. Toon opgeslagen melding
    const msg = document.getElementById('saveMsg');
    if(msg) msg.textContent = `✅ Automatisch opgeslagen! (${history.length} foto's in geschiedenis) + gedownload naar Downloads`;
    
    // 4. Probeer ook te delen naar fotobibliotheek via Web Share API (nieuwe telefoons)
    if(navigator.canShare && navigator.share){
      // niet automatisch, wel knop
    }
  } catch(e){
    console.log('save fail',e);
  }
}

let currentLat=0, currentLon=0;

function showHistory(){
  const h = JSON.parse(localStorage.getItem('kaasHistory')||'[]');
  if(h.length===0) return 'Nog geen geschiedenis';
  return h.slice(0,5).map(item=>`<div style="display:flex;gap:8px;margin-top:8px;align-items:center"><img src="${item.image}" style="width:50px;height:50px;object-fit:cover;border-radius:8px"><div><b style="font-size:12px">${item.drink}</b><br><span style="font-size:10px;color:#888">${item.date} - ${item.region}</span></div></div>`).join('');
}


function addToProeverij(){
  const drink = document.getElementById('drinkName').textContent;
  const desc = document.getElementById('drinkDesc').textContent;
  const cheeses = document.getElementById('cheeseList').innerHTML;
  const imgSrc = document.getElementById('previewImg').src;
  let list = JSON.parse(localStorage.getItem('proeverij')||'[]');
  list.push({id:Date.now(), drink, desc, cheeses, img:imgSrc, date:new Date().toLocaleString('nl-NL'), region:currentRegion});
  localStorage.setItem('proeverij', JSON.stringify(list));
  alert(`✅ Sheet opgeslagen! Nu ${list.length} aparte sheets klaar om te printen.`);
  updateProeverijBadge();
}
function updateProeverijBadge(){
  const list = JSON.parse(localStorage.getItem('proeverij')||'[]');
  const b = document.getElementById('proeverijBadge');
  const b2 = document.getElementById('proeverijBadge2');
  if(b) b.textContent = `🍷 Proeverij (${list.length} sheets)`;
  if(b2) b2.textContent = `🍷 Mijn proeverij sheets (${list.length}) - Print per stuk`;
}

function showProeverij(){
  const list = JSON.parse(localStorage.getItem('proeverij')||'[]');
  const history = JSON.parse(localStorage.getItem('kaasHistory')||'[]');
  const all = list.length>0 ? list : history.map(h=>({drink:h.drink, desc:'Uit geschiedenis', cheeses:`<div class="cheese">${h.drink} - ${h.region}</div>`, img:h.image, date:h.date, region:h.region}));
  
  if(all.length===0){ alert('Nog geen foto\'s. Maak eerst een foto van een wijn'); return; }
  let html = `<div id="printArea" style="padding:20px;font-family:Inter">`;
  html += `<style>@media print { .no-print{display:none} .sheet{page-break-after:always} } .sheet{border:2px dashed #ccc;border-radius:16px;padding:20px;margin-bottom:20px;page-break-after:always}</style>`;
  html += `<div class="no-print" style="margin-bottom:20px"><h1 style="font-family:Fraunces">🍷 Jouw Proeverij Sheets - ${all.length} stuks</h1><p>Elke foto + kazen = aparte A4 sheet. Klik print voor alles, of per sheet.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button onclick="window.print()" style="padding:12px 20px;background:#111;color:#fff;border:none;border-radius:12px">🖨️ Print ALLE sheets (elke op eigen A4)</button><button onclick="downloadProeverijPDF()" style="padding:12px 20px;background:#2e7d32;color:#fff;border:none;border-radius:12px">📄 Download als PDF (elk op eigen pagina)</button><button onclick="clearProeverij()" style="padding:12px 20px;background:#ffebee;border:none;border-radius:12px">🗑️ Alles wissen</button><button onclick="document.getElementById('proeverijView').style.display='none'" style="padding:12px 20px">Sluiten</button></div><hr></div>`;
  
  all.forEach((item, i)=>{
    html += `<div class="sheet" id="sheet-${i}" style="background:#fff">
      <div style="display:flex;justify-content:space-between"><span style="background:#111;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px">Sheet ${i+1}/${all.length}</span><span style="font-size:12px;color:#888">${item.date} | ${item.region}</span></div>
      <div style="display:flex;gap:20px;margin-top:16px;flex-wrap:wrap">
        <img src="${item.img}" style="width:220px;height:320px;object-fit:contain;border-radius:16px;background:#f9f6ef;border:1px solid #eee">
        <div style="flex:1;min-width:200px">
          <h2 style="font-family:Fraunces;margin:0 0 8px">${item.drink}</h2>
          <p style="color:#666;font-size:13px">${item.desc}</p>
          <h3 style="margin-top:16px;font-size:16px">🧀 Bijpassende kazen uit jouw regio:</h3>
          <div style="margin-top:8px">${item.cheeses}</div>
          <div style="margin-top:16px;padding:10px;background:#fbf8f1;border-radius:12px;font-size:11px">📍 Gevonden in: ${item.region} | Te koop bij: Kaashandel Peters Duiven, Boerderijwinkel Liemers<br>Tip: Serveer kaas op kamertemperatuur 30min van te voren</div>
        </div>
      </div>
      <div class="no-print" style="margin-top:12px"><button onclick="printSheet(${i})" style="padding:8px 14px;border-radius:10px;border:1px solid #ddd;background:#fff">🖨️ Print alleen deze sheet</button></div>
    </div>`;
  });
  html += `</div>`;

  if(!div){
    div = document.createElement('div');
    div.id='proeverijView';
    div.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:#fbf8f1;overflow:auto;z-index:9999;padding:20px';
    document.body.appendChild(div);

function printSheet(i){
  const sheet = document.getElementById(`sheet-${i}`);
  const win = window.open('', '', 'height=800,width=600');
  win.document.write('<html><head><title>Sheet '+(i+1)+'</title></head><body>');
  win.document.write(sheet.innerHTML);
  win.document.write('</body></html>');
  win.document.close();
  win.print();
}

function downloadProeverijPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const list = JSON.parse(localStorage.getItem('proeverij')||'[]');
  const history = JSON.parse(localStorage.getItem('kaasHistory')||'[]');
  const all = list.length>0 ? list : history;
  if(all.length===0) return;
  
  all.forEach((item, i)=>{
    if(i>0) doc.addPage();
    doc.setFontSize(18); doc.text(`Sheet ${i+1}: ${item.drink}`, 10, 15);
    doc.setFontSize(10); doc.text(`${item.date} | Regio: ${item.region}`, 10, 22);
    doc.setFontSize(11); doc.text('Bijpassende kazen uit regio:',10,32);
    // cheese text clean
    const cheeseText = (item.cheeses||'').replace(/<[^>]*>/g,' ').substring(0,300);
    const lines = doc.splitTextToSize(cheeseText, 180);
    doc.text(lines, 10, 40);
    doc.setFontSize(9); doc.text('Tip: Kaas 30min op kamertemperatuur - verkrijgbaar bij lokale kaashandel',10,280);
  });
  doc.save(`proeverij-sheets-${new Date().toISOString().slice(0,10)}.pdf`);
}

function clearProeverij(){
  if(confirm('Alle sheets wissen?')){
    localStorage.removeItem('proeverij');
    const v=document.getElementById('proeverijView'); if(v) v.style.display='none';
    updateProeverijBadge();
  }
}
setTimeout(updateProeverijBadge, 600);

let currentRegion='NL';
let currentCheeses=cheeseDB.NL;


async function searchLocalCheese(lat,lon){
  const info = document.getElementById('localShops');
  info.innerHTML = '🔍 Zoeken naar kaasboeren & kaasspeciaalzaken binnen 15km van je locatie...';
  try {
    // Overpass API - cheese shops, farm shops, deli around location
    const radius = 15000;
    const query = `[out:json][timeout:10];(node(around:${radius},${lat},${lon})[shop=cheese];node(around:${radius},${lat},${lon})[shop=deli];node(around:${radius},${lat},${lon})[shop=farm];way(around:${radius},${lat},${lon})[shop=cheese];);out center 20;`;
    const res = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body:query});
    const data = await res.json();
    if(!data.elements || data.elements.length===0){
      info.innerHTML = `📍 Geen kaaswinkels direct gevonden in 15km, wel deze vaste lokale adressen rond Duiven:<br><br>
      • <b>Kaashandel Peters - Duiven</b> (Remeker, Goudse Oude)<br>
      • <b>Boerderijwinkel De Liemers - Zevenaar</b> (Boerenkaas, Geitenkaas)<br>
      • <b>Kaasboerderij Groot Nibbelink - Doesburg</b> (Doesburgse Mosterdkaas)<br>
      • <b>Biologische winkel De Groene Schuur - Groessen</b><br>
      • <b>Jumbo / AH Duiven - streekkaas schap</b>`;
      return;
    }
    let html = `🧀 <b>${data.elements.length} kaas-adressen binnen 15km gevonden:</b><br><br>`;
    data.elements.slice(0,8).forEach(el=>{
      const name = el.tags?.name || el.tags?.shop || 'Kaaswinkel';
      const addr = [el.tags?.['addr:street'], el.tags?.['addr:city']].filter(Boolean).join(' ');
      html += `• <b>${name}</b> ${addr?'- '+addr:''}<br>`;
    });
    html += `<br><small>Live gezocht via OpenStreetMap rond ${lat.toFixed(3)},${lon.toFixed(3)}</small>`;
    info.innerHTML = html;
  } catch(e){
    info.innerHTML = `⚠️ Live zoeken mislukt, vaste lokale tips rond Duiven:<br>
    • Kaashandel Peters Duiven<br>
    • Boerderijwinkel Zevenaar<br>
    • Kaasboerderij Doesburg (Mosterdkaas)<br>
    • Betuwse Geitenboerderij Opheusden`;
  }
}

function detectRegion(lat,lon){
  searchLocalCheese(lat,lon);
if(lat>=50.5 && lat<=54 && lon>=3 && lon<=7.5){currentRegion='NL';}
else if(lat>=47 && lat<=55.5 && lon>=5.5 && lon<=15.5){currentRegion='DE';}
else if(lat>=49.4 && lat<=51.6 && lon>=2.5 && lon<=6.5){currentRegion='BE';}
else {currentRegion='DEFAULT';}
currentCheeses=cheeseDB[currentRegion] || cheeseDB.DEFAULT;
  currentLat=lat; currentLon=lon;
document.getElementById('locBadge').textContent = currentRegion==='NL'?'📍 Gelderland, NL': currentRegion==='DE'?'📍 NRW, DE': currentRegion==='BE'?'📍 BE': '📍 Europa';
document.getElementById('locText').textContent = currentRegion==='NL'?'Kazen uit jouw regio: Gelderland & NL':'Kazen uit jouw regio';
document.getElementById('gpsInfo').textContent = `GPS: ${lat.toFixed(3)}, ${lon.toFixed(3)} → ${currentRegion}`;
}
function initGPS(){
if(!navigator.geolocation){document.getElementById('gpsInfo').textContent='Geen GPS, default NL'; return;}
navigator.geolocation.getCurrentPosition(pos=>{detectRegion(pos.coords.latitude,pos.coords.longitude);},err=>{document.getElementById('gpsInfo').textContent='Locatie uit → NL (Duiven) default'; currentRegion='NL'; currentCheeses=cheeseDB.NL;},{enableHighAccuracy:false,timeout:5000});
}
initGPS(); setTimeout(()=>{ const hd=document.getElementById("historyDiv"); if(hd) hd.innerHTML=showHistory(); }, 500);

function detectDrinkFromText(text){
  const t = text.toLowerCase();
  // Priority 1: exact grape names - must be whole word
  if(/\bsauvignon\b/.test(t)) return {name:"Sauvignon Blanc - Fris & Fruitig",desc:`✅ Herkend: Sauvignon Blanc`};
  if(/\bchardonnay\b/.test(t)) return {name:"Chardonnay - Rijk & Romig",desc:`✅ Herkend: Chardonnay`};
  if(/\briesling\b/.test(t)) return {name:"Riesling - Fris & Fruitig",desc:`✅ Herkend: Riesling`};
  if(/\bcabernet\b|\bmerlot\b|\bpinot\s+noir\b|\bshiraz\b|\bsyrah\b/.test(t)) return {name:"Rode Wijn - Krachtig",desc:`✅ Herkend: Rode wijn`};
  // Priority 2: beer - only if explicit
  if(/\bwitbier\b|\bweizen\b|\bwit\s+bier\b/.test(t)) return {name:"Witbier - Zacht & Kruidig",desc:`✅ Herkend: Witbier`};
  if(/\bport\b|\bporto\b/.test(t)) {
    // extra check: not "imported" - need word boundary already
    return {name:"Port - Zoet & Warm",desc:`✅ Herkend: Port`};
  }
  if(/\bbier\b|\bipa\b|\bpils\b/.test(t)) return {name:"Bier - Kruidig",desc:`✅ Herkend: Bier`};
  // If nothing found
  return null;
}

function showResult(drink, previewSrc, ocrText){
  document.getElementById('previewImg').src=previewSrc;
  document.getElementById('uploadCard').style.display='none';
  document.getElementById('resultCard').style.display='block';
  document.getElementById('drinkName').textContent=drink.name;
  document.getElementById('drinkDesc').textContent=drink.desc + (ocrText?` | OCR: ${ocrText.substring(0,80)}`:'');
  document.getElementById('cheeseTitle').textContent = `Kazen uit ${currentRegion}:`;
  autoSavePhoto(previewSrc, drink.name);
  const shuffled=[...currentCheeses].sort(()=>0.5-Math.random()).slice(0,6);
  document.getElementById('cheeseList').innerHTML=shuffled.map(c=>`<div class="cheese"><b>${c.n}</b><br><span style="font-size:12px;color:#888">${c.o}</span><br><span style="font-size:13px">${c.r}</span></div>`).join('') + `<div style="margin-top:16px"><button style="width:100%;padding:10px;border-radius:12px;border:1px solid #ddd;background:#fff" onclick="document.getElementById('manualBox').style.display='block'">❌ Niet goed? Corrigeer</button><div id="manualBox" style="display:none;margin-top:10px">${drinks.map(d=>`<button onclick="correctDrink('${d.name}')" style="display:block;width:100%;text-align:left;padding:8px;margin-top:6px;border-radius:10px;border:1px solid #eee">${d.name}</button>`).join('')}</div></div>`;
}
function correctDrink(name){
 const d = drinks.find(x=>x.name===name);
 if(d){ document.getElementById('drinkName').textContent=d.name; document.getElementById('drinkDesc').textContent=d.desc+' (handmatig)'; }
 document.getElementById('manualBox').style.display='none';
}
function handleFile(f){
 if(!f) return;
 const previewSrc = URL.createObjectURL(f);
 document.getElementById('ocrInfo').textContent='🔍 Etiket lezen... even wachten';
 document.getElementById('previewImg').src=previewSrc;
 if(window.Tesseract){
   Tesseract.recognize(f,'nld+eng', { logger: m=>{ document.getElementById('ocrInfo').textContent = m.status + ' ' + Math.round((m.progress||0)*100)+'%' } }).then(({data:{text, confidence}})=>{
     console.log('OCR:',text);
     document.getElementById('ocrInfo').textContent='Gevonden tekst: '+text.substring(0,100);
     let drink = detectDrinkFromText(text);
     if(!drink){ drink={name:"Sauvignon? Kies zelf - OCR onzeker",desc:`Kon geen duidelijk druif vinden. OCR zag: "${text.substring(0,80)}" - kies hieronder`}; }
     if(confidence && confidence < 30){ drink.desc += ` (lage zekerheid ${Math.round(confidence)}%)`; }
     showResult(drink,previewSrc,text);
   }).catch(e=>{
     document.getElementById('ocrInfo').textContent='OCR mislukt';
     showResult(drinks[0],previewSrc,'');
   });
 } else {
   showResult(drinks[0],previewSrc,'');
 }
}
document.getElementById('file1').addEventListener('change',e=>handleFile(e.target.files[0]));
document.getElementById('file2').addEventListener('change',e=>handleFile(e.target.files[0]));
function resetApp(){
  setTimeout(()=>{ document.getElementById('historyDiv').innerHTML = showHistory(); }, 200);

 document.getElementById('previewImg').src='';
 document.getElementById('resultCard').style.display='none';
 document.getElementById('uploadCard').style.display='block';
 document.getElementById('file1').value='';document.getElementById('file2').value='';
 document.getElementById('ocrInfo').textContent='';
}
</script>
