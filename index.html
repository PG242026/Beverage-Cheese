<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>v27</title>
<style>body{font-family:sans-serif;padding:15px}button{width:100%;padding:18px;font-size:18px;font-weight:700;border:none;border-radius:14px;margin:8px 0;background:#111;color:#fff}img{max-width:100%;border-radius:14px}#status{padding:12px;background:#e8f5e9;border-radius:10px;text-align:center}</style></head><body>
<h2>🍷 v27 - Blijft in scherm</h2>
<div id=status>Klaar</div>
<input type=file id=f1 accept="image/*" capture=environment style=display:none>
<input type=file id=f2 accept="image/*" style=display:none>
<button onclick="document.getElementById('f1').click()">📸 MAAK FOTO</button>
<button onclick="document.getElementById('f2').click()" style="background:#eee;color:#111">📁 Bibliotheek</button>
<img id=preview style=display:none>
<div id=gallery></div>
<script>
let photos=[]; let cur='';
try{photos=JSON.parse(localStorage.getItem('v27p')||'[]')}catch(e){}
function upd(){document.getElementById('gallery').innerHTML=photos.map(p=>'<div><img src="'+p.src+'" style="height:80px"> '+p.date+'</div>').join('');}
upd();
function handle(f){
 if(!f) return;
 cur=URL.createObjectURL(f);
 const im=document.getElementById('preview'); im.src=cur; im.style.display='block';
 document.getElementById('status').textContent='✅ FOTO HIERONDER - NIET WEG!';
 photos.unshift({src:cur,date:new Date().toLocaleTimeString()});
 try{localStorage.setItem('v27p', JSON.stringify(photos.slice(0,5)))}catch(e){}
 upd();
}
document.getElementById('f1').addEventListener('change',e=>{handle(e.target.files[0]); e.target.value='';});
document.getElementById('f2').addEventListener('change',e=>{handle(e.target.files[0]); e.target.value='';});
</script></body></html>
